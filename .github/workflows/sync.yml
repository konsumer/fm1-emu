# This fork: upstream's master merged in daily on top of our commits (?package=URL, fm1-emu#158), and
# published on Pages.

name: Sync upstream

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/joakimeriksson/fm1-emu.git
          git fetch upstream master
          before=$(git rev-parse HEAD)
          git merge --no-edit upstream/master
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            git push origin HEAD:master
            # (a push with this token starts no workflow, so the deploy is started by hand)
            gh workflow run pages.yml --ref master
          fi
        env:
          GH_TOKEN: ${{ github.token }}
